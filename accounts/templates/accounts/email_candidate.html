{% extends 'base.html' %}

{% block content %}
<div class="p-3">
  <div class="container">

    <h2>Send Email</h2>
    <hr />

    <form method="POST" class="card shadow p-3 mb-4">
      {% csrf_token %}

      <label>From</label>
      <input type="text" class="form-control mb-3" value="{{ user.email }}" disabled>

      <label>To</label>
      <input type="text" class="form-control mb-3"
             value="{{ template_data.candidate.username }} ({{ template_data.candidate.email }})" disabled>

      <label>Subject</label>
      {{ template_data.form.subject.errors }}
      <div class="mb-3">{{ template_data.form.subject }}</div>

      <label>Message</label>
      {{ template_data.form.body.errors }}
      <div class="mb-3">{{ template_data.form.body }}</div>

      <div>
        <a class="btn btn-outline-dark" href="{% url 'accounts.candidate_search' %}">Cancel</a>
        <button class="btn bg-dark text-white" type="submit">Send</button>
      </div>

    </form>

  </div>
</div>
{% endblock %}
