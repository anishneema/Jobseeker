{% extends 'base.html' %}
{% block content %}
<div class="p-3 mt-4">
  <div class="container">
    <div class="row">
      <div class="col-md-8 mx-auto text-center">
        <h2>Find your next role</h2>
        <p class="text-muted">Search openings, or post a job if you are hiring.</p>
        <a class="btn bg-dark text-white me-2" href="{% url 'jobs.index' %}">Search Jobs</a>
        {% if is_recruiter %}
        <a class="btn btn-outline-dark" href="{% url 'jobs.post' %}">Post a Job</a>
        {% elif not user.is_authenticated %}
        <a class="btn btn-outline-dark" href="{% url 'accounts.signup' %}">Sign Up</a>
        {% endif %}
      </div>
    </div>
  </div>
</div>
{% endblock content %}
