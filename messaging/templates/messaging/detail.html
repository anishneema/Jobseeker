{% extends 'base.html' %}
{% block content %}
<div class="p-3">
  <div class="container">
    <div class="card shadow p-3 mb-4">
      <div class="card-body">
        <p class="text-muted mb-1">
          From <strong>{{ template_data.message.sender_label }}</strong>
          to <strong>{{ template_data.message.recipient.username }}</strong>
        </p>
        <p class="text-muted">{{ template_data.message.created_at|date:"M j, Y, g:i a" }}</p>
        <hr />
        <p>{{ template_data.message.body|linebreaksbr }}</p>
        <a class="btn btn-outline-secondary" href="{% url 'messaging.inbox' %}">Back</a>
      </div>
    </div>
  </div>
</div>
{% endblock content %}
